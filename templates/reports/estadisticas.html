{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="max-w-6xl mx-auto space-y-5 pb-10">
  <h1 class="text-xl font-bold text-slate-900">📊 Estadísticas de la clínica</h1>
  <div class="grid md:grid-cols-2 gap-5">
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5"><h3 class="font-bold text-slate-900 mb-3">Top 10 servicios facturados</h3><canvas id="c-top" height="220"></canvas></div>
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5"><h3 class="font-bold text-slate-900 mb-3">Ingresos por mes ($)</h3><canvas id="c-mes" height="220"></canvas></div>
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5"><h3 class="font-bold text-slate-900 mb-3">Pacientes por sexo</h3><canvas id="c-sexo" height="200"></canvas></div>
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5"><h3 class="font-bold text-slate-900 mb-3">Pacientes por rango de edad</h3><canvas id="c-edad" height="200"></canvas></div>
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5"><h3 class="font-bold text-slate-900 mb-3">Tratamientos aplicados</h3><canvas id="c-trat" height="200"></canvas></div>
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5"><h3 class="font-bold text-slate-900 mb-3">Citas por estado</h3><canvas id="c-estado" height="200"></canvas></div>
  </div>
</div>
<script src="{% static 'js/chart.umd.min.js' %}"></script>
<script>
const azul = '#0ea5e9', verde = '#10b981', rosa = '#ec4899', violeta = '#8b5cf6', ambar = '#f59e0b';
new Chart(document.getElementById('c-top'), {type:'bar', data:{labels:{{ top_labels|safe }}, datasets:[{label:'Facturaciones', data:{{ top_data|safe }}, backgroundColor:azul}]}});
new Chart(document.getElementById('c-mes'), {type:'line', data:{labels:{{ mes_labels|safe }}, datasets:[{label:'Ingresos $', data:{{ mes_data|safe }}, borderColor:verde, backgroundColor:'rgba(16,185,129,.15)', fill:true, tension:.3}]}});
new Chart(document.getElementById('c-sexo'), {type:'doughnut', data:{labels:{{ sexo_labels|safe }}, datasets:[{data:{{ sexo_data|safe }}, backgroundColor:[azul, rosa, violeta]}]}});
new Chart(document.getElementById('c-edad'), {type:'bar', data:{labels:{{ edad_labels|safe }}, datasets:[{label:'Pacientes', data:{{ edad_data|safe }}, backgroundColor:ambar}]}});
new Chart(document.getElementById('c-trat'), {type:'doughnut', data:{labels:{{ trat_labels|safe }}, datasets:[{data:{{ trat_data|safe }}, backgroundColor:[azul, verde, rosa, violeta, ambar, '#dc2626', '#fb923c', '#06b6d4']}]}});
new Chart(document.getElementById('c-estado'), {type:'doughnut', data:{labels:{{ estado_labels|safe }}, datasets:[{data:{{ estado_data|safe }}, backgroundColor:[verde, azul, '#dc2626']}]}});
</script>
{% endblock %}
