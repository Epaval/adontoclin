{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
    <h1 class="text-xl font-bold text-slate-900">% Ajuste masivo de precios</h1>
    <p class="text-sm text-slate-500 mt-1">Aplica un porcentaje (+/-) a todos los servicios activos en $.</p>
    <form method="post" class="mt-4 flex items-end gap-3">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Porcentaje (%)</label>
        <input type="number" step="0.01" name="porcentaje" required class="px-3 py-2 border border-slate-300 rounded-lg w-40">
      </div>
      <button class="bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-lg font-semibold">Aplicar ajuste</button>
    </form>
    <table class="w-full text-sm mt-6">
      <thead class="text-xs uppercase text-slate-500"><tr><th class="text-left py-2">Servicio</th><th class="text-right py-2">Precio $</th></tr></thead>
      <tbody class="divide-y divide-slate-100">
        {% for s in servicios %}<tr><td class="py-2">{{ s.nombre }}</td><td class="py-2 text-right font-semibold">${{ s.precio_usd }}</td></tr>{% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
