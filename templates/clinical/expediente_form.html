{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
    <h1 class="text-xl font-bold text-slate-900">📋 {{ title }}</h1>
    <p class="text-sm text-slate-500 mt-1">Patologías, alergias y operaciones del paciente (editable en cualquier momento)</p>
    <form method="post" class="mt-5 space-y-4">
      {% csrf_token %}
      {% for field in form %}
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p class="text-xs text-red-600 mt-1">{{ field.errors }}</p>{% endif %}
      </div>
      {% endfor %}
      <div class="flex gap-3 pt-4 border-t border-slate-200">
        <button class="bg-sky-500 hover:bg-sky-600 text-white px-5 py-2.5 rounded-lg font-semibold text-sm">Guardar</button>
        <a href="javascript:history.back()" class="px-5 py-2.5 rounded-lg border border-slate-200 text-slate-600 text-sm font-semibold">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
