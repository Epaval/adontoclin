{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="card p-6" style="background:var(--card,#1e293b);border:1px solid var(--border,#334155);border-radius:16px">
    {% if exito %}
    <div class="text-center">
      <div class="text-6xl mb-4">✅</div>
      <h1 class="text-xl font-bold mb-4">Acceso remoto instalado</h1>
      <div class="bg-emerald-900 bg-opacity-20 border border-emerald-500 rounded-lg p-4 text-left">
        <pre class="text-xs whitespace-pre-wrap" style="font-family:monospace">{{ mensaje }}</pre>
      </div>
      <div class="mt-6 space-x-3">
        <a href="{% url 'acceso_remoto' %}" class="bg-sky-500 hover:bg-sky-600 text-white px-5 py-2.5 rounded-lg font-bold">Ver panel de acceso remoto</a>
        <a href="/" class="bg-slate-600 hover:bg-slate-700 text-white px-5 py-2.5 rounded-lg font-bold">Volver al dashboard</a>
      </div>
    </div>
    {% else %}
    <div class="text-center">
      <div class="text-6xl mb-4">❌</div>
      <h1 class="text-xl font-bold mb-4 text-red-400">Error en la instalación</h1>
      <div class="bg-red-900 bg-opacity-20 border border-red-500 rounded-lg p-4 text-left">
        <pre class="text-xs whitespace-pre-wrap" style="font-family:monospace">{{ error }}</pre>
      </div>
      <div class="mt-6">
        <a href="/" class="bg-slate-600 hover:bg-slate-700 text-white px-5 py-2.5 rounded-lg font-bold">Volver</a>
      </div>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
