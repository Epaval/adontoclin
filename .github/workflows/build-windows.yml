name: Build Windows Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pip install pyinstaller

      - name: Static files
        run: |
          $env:LABCLIN_MODO="escritorio"
          python manage.py collectstatic --noinput

      - name: Compilar exe
        run: pyinstaller odontoclin.spec --noconfirm

      - name: Compilar instalador
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y }
          & $iscc installer.iss

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: OdontoClin-Setup
          path: instalador/*.exe


      - name: Publicar Release con el instalador
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: instalador/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
